name: oc-auth bug report
description: Report a problem with oc-auth (packages/oc-auth)
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start opencode with ...
        2. Open /connect and choose ...
        3. Select model ...
        4. Send ...
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Anthropic connection
      options:
        - Claude Code subscription
        - API key
        - Environment variable
        - Other OAuth method
    validations:
      required: true

  - type: dropdown
    id: credential-source
    attributes:
      label: Credential source
      options:
        - macOS Keychain
        - Credentials file
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: "Run: opencode plugin list"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: opencode-version
    attributes:
      label: OpenCode v2 version
      description: "Run: opencode --version"
      placeholder: "opencode v2.0.26"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: |
        Reproduce with OpenCode logging at debug level (its `--log-level`
        flag), then include the relevant records from
        `~/.local/share/opencode/log/opencode.log`.

        oc-auth redacts tokens in its records, but not Keychain service names
        or config paths. Review and redact those and any other sensitive values
        before you submit.
      render: json
    validations:
      required: false
