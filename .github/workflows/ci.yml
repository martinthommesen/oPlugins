name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # Each plugin job runs the plugin's tests on Linux and macOS, and its
  # headless host test on the oldest OpenCode it supports
  # (`engines.opencode`) and on the one it's built against.
  oc-advisor:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        host: ["oldest", "target"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/oc-advisor
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
        # The tests import src, not dist, which is what consumers get. Check
        # that dist loads on this OS before the host test installs it.
      - run: pnpm run verify:dist
      - run: pnpm run test:host
        env:
          OC_ADVISOR_HEADLESS_HOST_VERSION: ${{ matrix.host }}
      - run: pnpm pack --dry-run

  oc-auth:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        host: ["oldest", "target"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/oc-auth
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        # The keychain unit tests run against a stub; this lets the live test
        # write throwaway items through the real `security` tool. A dedicated
        # unlocked keychain keeps it from depending on the runner's login one.
      - name: Create a throwaway default keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s ci.keychain
      - run: pnpm test
        env:
          OC_AUTH_LIVE_KEYCHAIN: ${{ runner.os == 'macOS' && '1' || '' }}
        # The tests import src, not dist, which is what consumers get. Check
        # that dist loads on this OS before the host test installs it.
      - run: pnpm run verify:dist
      - run: pnpm run test:host
        env:
          OC_AUTH_HEADLESS_HOST_VERSION: ${{ matrix.host }}
      - run: pnpm pack --dry-run

  oc-auto:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        host: ["oldest", "target"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/oc-auto
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
        # The tests import src, not dist, which is what consumers get. Check
        # that dist loads on this OS before the host test installs it.
      - run: pnpm run verify:dist
      - run: pnpm run test:host
        env:
          OC_AUTO_HEADLESS_HOST_VERSION: ${{ matrix.host }}
      - run: pnpm pack --dry-run

  oc-browser:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        host: ["oldest", "target"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/oc-browser
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
        # The tests import src, not dist, which is what consumers get. Check
        # that dist loads on this OS before the host test installs it.
      - run: pnpm run verify:dist
      - run: pnpm run test:host
        env:
          OC_BROWSER_HEADLESS_HOST_VERSION: ${{ matrix.host }}
      - run: pnpm pack --dry-run

  oc-usage:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        host: ["oldest", "target"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/oc-usage
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
        # The tests import src, not dist, which is what consumers get. Check
        # that dist loads on this OS before the host test installs it.
      - run: pnpm run verify:dist
      - run: pnpm run test:host
        env:
          OC_USAGE_HEADLESS_HOST_VERSION: ${{ matrix.host }}
      - run: pnpm pack --dry-run
