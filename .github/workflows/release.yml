name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# release-please runs in manifest mode: release-please-config.json lists the
# released packages and .release-please-manifest.json their last versions.
# Each plugin is published by its own job below, after `pnpm run check` has
# built and verified every bundle.
#
# Publishing uses npm trusted publishing (OIDC through `id-token: write`), no
# token. It can only be configured once a package exists on npm, so each
# package's publish step stays off until its repository variable
# (OC_ADVISOR_NPM_PUBLISH, OC_AUTH_NPM_PUBLISH, OC_AUTO_NPM_PUBLISH,
# OC_BROWSER_NPM_PUBLISH) is set to `true`.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      oc_advisor_release_created: ${{ steps.release-please.outputs.oc_advisor_release_created }}
      oc_auth_release_created: ${{ steps.release-please.outputs.oc_auth_release_created }}
      oc_auto_release_created: ${{ steps.release-please.outputs.oc_auto_release_created }}
      oc_browser_release_created: ${{ steps.release-please.outputs.oc_browser_release_created }}
    steps:
      - name: Run release-please (attempt 1)
        uses: googleapis/release-please-action@v5
        id: release-please-1
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Run release-please (attempt 2)
        if: steps.release-please-1.outcome == 'failure'
        uses: googleapis/release-please-action@v5
        id: release-please-2
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Run release-please (attempt 3)
        if: steps.release-please-1.outcome == 'failure' && steps.release-please-2.outcome == 'failure'
        uses: googleapis/release-please-action@v5
        id: release-please-3
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Select release-please outputs
        id: release-please
        shell: bash
        run: |
          oc_advisor="${{ steps.release-please-1.outputs['packages/oc-advisor--release_created'] }}"
          oc_auth="${{ steps.release-please-1.outputs['packages/oc-auth--release_created'] }}"
          oc_auto="${{ steps.release-please-1.outputs['packages/oc-auto--release_created'] }}"
          oc_browser="${{ steps.release-please-1.outputs['packages/oc-browser--release_created'] }}"
          if [[ "${{ steps.release-please-2.outcome }}" == "success" ]]; then
            oc_advisor="${{ steps.release-please-2.outputs['packages/oc-advisor--release_created'] }}"
            oc_auth="${{ steps.release-please-2.outputs['packages/oc-auth--release_created'] }}"
            oc_auto="${{ steps.release-please-2.outputs['packages/oc-auto--release_created'] }}"
            oc_browser="${{ steps.release-please-2.outputs['packages/oc-browser--release_created'] }}"
          fi
          if [[ "${{ steps.release-please-3.outcome }}" == "success" ]]; then
            oc_advisor="${{ steps.release-please-3.outputs['packages/oc-advisor--release_created'] }}"
            oc_auth="${{ steps.release-please-3.outputs['packages/oc-auth--release_created'] }}"
            oc_auto="${{ steps.release-please-3.outputs['packages/oc-auto--release_created'] }}"
            oc_browser="${{ steps.release-please-3.outputs['packages/oc-browser--release_created'] }}"
          fi
          echo "oc_advisor_release_created=$oc_advisor" >> "$GITHUB_OUTPUT"
          echo "oc_auth_release_created=$oc_auth" >> "$GITHUB_OUTPUT"
          echo "oc_auto_release_created=$oc_auto" >> "$GITHUB_OUTPUT"
          echo "oc_browser_release_created=$oc_browser" >> "$GITHUB_OUTPUT"

  oc-advisor:
    needs: release-please
    if: needs.release-please.outputs.oc_advisor_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter @martinthommesen/oc-advisor publish --access public --provenance --no-git-checks --ignore-scripts
        if: vars.OC_ADVISOR_NPM_PUBLISH == 'true'

  oc-auth:
    needs: release-please
    if: needs.release-please.outputs.oc_auth_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter @martinthommesen/oc-auth publish --access public --provenance --no-git-checks --ignore-scripts
        if: vars.OC_AUTH_NPM_PUBLISH == 'true'

  oc-auto:
    needs: release-please
    if: needs.release-please.outputs.oc_auto_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter @martinthommesen/oc-auto publish --access public --provenance --no-git-checks --ignore-scripts
        if: vars.OC_AUTO_NPM_PUBLISH == 'true'

  oc-browser:
    needs: release-please
    if: needs.release-please.outputs.oc_browser_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter @martinthommesen/oc-browser publish --access public --provenance --no-git-checks --ignore-scripts
        if: vars.OC_BROWSER_NPM_PUBLISH == 'true'
