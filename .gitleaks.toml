# The secret scan: gitleaks' default rules, minus the paths that are never
# tracked and the fake or public values this repository holds on purpose.
# `pnpm run secrets` and the pre-commit hook both read it.
title = "oc-plugins"
# The gitleaks this config is written for; an older one warns.
minVersion = "v8.30.0"

[extend]
useDefault = true

[[allowlists]]
description = "Installed packages, build output, and someone else's working folders, none of which is tracked."
paths = [
  '''(?:^|/)node_modules(?:/|$)''',
  '''(?:^|/)dist(?:/|$)''',
  '''^research_notes(?:/|$)''',
  '''^reports(?:/|$)''',
]

[[allowlists]]
description = "Fake tokens in tests: a JWT header, {\"alg\":\"RS256\",\"typ\":\"JWT\"}, with a placeholder payload, and the base64 of \"this is a refresh token\"."
# Each value is allowed in a test file only.
condition = "AND"
paths = ['''\.test(?:-support)?\.ts$''']
regexTarget = "secret"
regexes = [
  '''^eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9\.abc123$''',
  '''^dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4$''',
]

[[allowlists]]
description = "Claude Code's public OAuth client ID, which oc-auth sends as Claude Code does. Every Claude Code install carries it; it isn't a secret."
regexTarget = "secret"
regexes = ['''^9d1c250a-e61b-44d9-88ed-5944d1962f5e$''']
