name: Bug Report
description: Report a problem with opencode-claude-auth
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start opencode2 with ...
        2. Open /connect and choose ...
        3. Select model ...
        4. Send ...
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Anthropic connection
      options:
        - Claude Code subscription
        - API key
        - Environment variable
        - Other OAuth method
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: "Run: npm view opencode-claude-auth version"
      placeholder: "3.0.0"
    validations:
      required: true

  - type: input
    id: opencode-version
    attributes:
      label: OpenCode v2 version
      description: "Run: opencode2 --version"
      placeholder: "opencode2 v0.0.0-beta-18381"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: |
        Reproduce with `CLAUDE_AUTH_DEBUG=1`, then include relevant plugin entries from
        `~/.local/share/opencode/claude-auth-debug.log` and relevant v2 service entries
        from `~/.local/share/opencode/log/opencode.log`.

        Review and redact authorization headers, prompts, file contents, and other
        sensitive values before submitting.
      render: json
    validations:
      required: false
