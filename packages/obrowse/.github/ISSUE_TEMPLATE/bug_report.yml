name: Bug Report
description: Report a problem with oBrowse
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start opencode with ...
        2. Open ... in the browser
        3. Ask the agent to ...
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Chromium
        - Microsoft Edge
        - Brave
        - Other Chromium-based browser
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser version
      description: "Open chrome://version"
      placeholder: "141.0.0.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: "Run: opencode plugin list"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: "Shown on the oBrowse card in chrome://extensions"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: opencode-version
    attributes:
      label: OpenCode v2 version
      description: "Run: opencode --version"
      placeholder: "opencode v2.0.26"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: |
        Reproduce with `OBROWSE_DEBUG=1`, then include relevant plugin entries from
        `~/.local/share/opencode/obrowse-debug.log` and relevant v2 service entries
        from `~/.local/share/opencode/log/opencode.log`.

        Review and redact URLs, page contents, cookies, prompts, and other
        sensitive values before submitting.
      render: json
    validations:
      required: false
