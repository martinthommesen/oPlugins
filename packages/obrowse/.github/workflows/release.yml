name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect an explicit major version
        id: release-as
        shell: bash
        run: |
          current="$(node -p "require('./package.json').version")"
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          latest="${latest#v}"
          if [[ -z "$latest" || "${current%%.*}" -gt "${latest%%.*}" ]]; then
            echo "version=$current" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release-please (attempt 1)
        uses: googleapis/release-please-action@v5
        id: release-please-1
        continue-on-error: true
        with:
          release-type: node
          release-as: ${{ steps.release-as.outputs.version }}

      - name: Run release-please (attempt 2)
        if: steps.release-please-1.outcome == 'failure'
        uses: googleapis/release-please-action@v5
        id: release-please-2
        continue-on-error: true
        with:
          release-type: node
          release-as: ${{ steps.release-as.outputs.version }}

      - name: Run release-please (attempt 3)
        if: steps.release-please-1.outcome == 'failure' && steps.release-please-2.outcome == 'failure'
        uses: googleapis/release-please-action@v5
        id: release-please-3
        with:
          release-type: node
          release-as: ${{ steps.release-as.outputs.version }}

      - name: Select release-please outputs
        id: release-please
        shell: bash
        run: |
          releases_created="${{ steps.release-please-1.outputs.releases_created }}"
          if [[ "${{ steps.release-please-2.outcome }}" == "success" ]]; then
            releases_created="${{ steps.release-please-2.outputs.releases_created }}"
          fi
          if [[ "${{ steps.release-please-3.outcome }}" == "success" ]]; then
            releases_created="${{ steps.release-please-3.outputs.releases_created }}"
          fi
          echo "releases_created=$releases_created" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.release-please.outputs.releases_created == 'true'

      - uses: actions/setup-node@v4
        if: steps.release-please.outputs.releases_created == 'true'
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
        if: steps.release-please.outputs.releases_created == 'true'
      - run: pnpm run lint
        if: steps.release-please.outputs.releases_created == 'true'
      - run: pnpm run build
        if: steps.release-please.outputs.releases_created == 'true'
      - run: pnpm test
        if: steps.release-please.outputs.releases_created == 'true'
      - run: pnpm pack --dry-run
        if: steps.release-please.outputs.releases_created == 'true'
      - run: pnpm publish --access public --provenance --no-git-checks --ignore-scripts
        if: steps.release-please.outputs.releases_created == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
